<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>3</title>
<script src="https://js.puter.com/v2/"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="accueil"><div id="halo-flamme"></div><div id="etoile-filante"></div></div>

<div id="chat">
  <div id="zone-logo" style="position: absolute; top: 18vh; left: 6vw; width: 15vw; height: 15vw; cursor: pointer; z-index: 999;"></div>
  <span class="theme" id="theme-courant"></span>
  
  <div id="menu-deroulant">
    <a href="#" onclick="ouvrirPanneau('miroir')">Mon Miroir</a>
    <a href="#" onclick="ouvrirPanneau('cle')">Ma Clé</a>
    <a href="#" onclick="ouvrirPanneau('apropos')">À propos de 3</a>
    <a href="#" onclick="ouvrirPanneau('match')">Débloquer mon Match</a>
  </div>

  <div id="input-zone">
    <button id="plus-btn">+</button>
    <input type="text" id="user-input" placeholder="Écris-moi quelque chose..." autocomplete="off">
    <button id="send-btn">→</button>
  </div>
  
  <div id="bulles"></div>
  
  <div id="carte-swipe" class="cachee">
    <div id="carte-texte" style="pointer-events: none;"></div>
    <div id="carte-touch" style="position: absolute; inset: 0; z-index: 10; touch-action: none;"></div>
    <div id="carte-aide" style="font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: 10px;">Glissez vers le haut pour Oui, vers le bas pour Non</div>
  </div>
</div>

<div id="image-plein-ecran"></div>

<div id="panneau"><div id="panneau-contenu"></div><div id="fermer-panneau" onclick="document.getElementById('panneau').classList.remove('visible')">✕</div></div>

<script src="script.js"></script>
</body>
</html>

<div id="panneau-defauts" class="cachee">
  <div class="contenu-defauts">
    <h3>Choisis tes 3 pires défauts</h3>
    <div id="slots-defauts">
      <div class="slot" id="slot-1">1er choix</div>
      <div class="slot" id="slot-2">2ème choix</div>
      <div class="slot" id="slot-3">3ème choix</div>
    </div>
    <div id="liste-defauts"></div>
    <button id="valider-defauts" disabled onclick="validerDefauts()">Valider mes défauts</button>
  </div>
</div>

</body>
</html>
