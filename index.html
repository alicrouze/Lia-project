<!DOCTYPE html>
<html lang="fr">
<head>
<script src="https://js.puter.com/v2/"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="accueil"><div id="halo-flamme"></div><div id="etoile-filante"></div></div>

<div id="chat">
  <div id="zone-logo" style="position: absolute; top: 80px; left: 5%; width: 60px; height: 60px; cursor: pointer; z-index: 999;"></div>
  <span class="theme" id="theme-courant"></span>
  
  <div id="menu-deroulant">
    <a href="#" onclick="ouvrirPanneau('miroir')">Mon Miroir</a>
    <a href="#" onclick="ouvrirPanneau('cle')">Ma Clé</a>
    <a href="#" onclick="ouvrirPanneau('apropos')">À propos de 3</a>
    <a href="#" onclick="ouvrirPanneau('match')">Débloquer mon Match</a>
  </div>

  <div id="input-zone"><button id="plus-btn">+</button><input type="text" id="user-input" placeholder="Écris-moi quelque chose..." autocomplete="off"><button id="send-btn">→</button></div>
  <div id="bulles"></div><div id="carte-swipe" class="cachee"><div id="carte-texte" style="pointer-events: none;"></div><div id="carte-touch" style="position: absolute; inset: 0; z-index: 10; touch-action: none;"></div><div id="carte-aide" style="font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: 10px;">Glissez vers le haut pour Oui, vers le bas pour Non</div><div id="carte-boutons"><button id="btn-non">❌ Non</button><button id="btn-oui">✅ Oui</button></div></div>
</div>

<script src="script.js"></script>

<div id="panneau"><div id="panneau-contenu"></div><div id="fermer-panneau" onclick="document.getElementById('panneau').classList.remove('visible')">✕</div></div>

<button onclick="afficherCarte()" style="position:fixed; bottom: 20px; left: 10px; z-index: 999; background: #d4a960; border: none; padding: 8px; border-radius: 5px; color: #000;">TEST CARTE</button><button onclick="swipeCarte(true)" style="position:fixed; bottom: 20px; left: 100px; z-index: 999; background: #ff5555; border: none; padding: 8px; border-radius: 5px; color: #fff;">SWIPE TEST</button></body>
</html>
