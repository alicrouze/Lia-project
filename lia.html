<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    position: fixed;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  
  /* ÉCRAN D'ACCUEIL */
  #splash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a15 70%, #000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s ease;
    cursor: pointer;
  }
  
  #splash.hidden {
    opacity: 0;
    pointer-events: none;
  }
  
  #logo-3 {
    font-size: 40vh;
    font-weight: 500;
    color: #fff;
    text-align: center;
    line-height: 1;
    position: relative;
    animation: pulse 2s ease-in-out infinite;
    text-shadow: 
      0 0 30px rgba(255, 100, 120, 1),
      0 0 90px rgba(255, 80, 100, 0.8),
      0 0 180px rgba(255, 60, 80, 0.6),
      0 0 280px rgba(255, 40, 60, 0.4);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    letter-spacing: -0.06em;
    transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      text-shadow: 
        0 0 30px rgba(255, 100, 120, 1),
        0 0 90px rgba(255, 80, 100, 0.8),
        0 0 180px rgba(255, 60, 80, 0.6),
        0 0 280px rgba(255, 40, 60, 0.4);
    }
    50% {
      transform: scale(1.12);
      text-shadow: 
        0 0 45px rgba(255, 130, 150, 1),
        0 0 120px rgba(255, 90, 110, 1),
        0 0 220px rgba(255, 60, 80, 0.8),
        0 0 340px rgba(255, 40, 60, 0.5);
    }
  }
  
  #splash-hint {
    position: absolute;
    bottom: 12%;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    letter-spacing: 0.15em;
    animation: fadeHint 3s ease-in-out infinite;
  }
  
  @keyframes fadeHint {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
  
  /* CONVERSATION */
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #f5f5f7;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  
  #app.visible {
    opacity: 1;
  }
  
  /* EN-TÊTE AVEC LE 3 */
  #header {
    background: #0a0a15;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  
  #header-logo {
    font-size: 32px;
    font-weight: 500;
    color: #fff;
    line-height: 1;
    text-shadow: 
      0 0 10px rgba(255, 100, 120, 0.9),
      0 0 25px rgba(255, 80, 100, 0.6),
      0 0 45px rgba(255, 60, 80, 0.4);
    animation: headerPulse 2s ease-in-out infinite;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    letter-spacing: -0.06em;
  }
  
  @keyframes headerPulse {
    0%, 100% {
      text-shadow: 
        0 0 10px rgba(255, 100, 120, 0.9),
        0 0 25px rgba(255, 80, 100, 0.6),
        0 0 45px rgba(255, 60, 80, 0.4);
    }
    50% {
      text-shadow: 
        0 0 15px rgba(255, 130, 150, 1),
        0 0 35px rgba(255, 90, 110, 0.8),
        0 0 60px rgba(255, 60, 80, 0.5);
    }
  }
  
  #messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 12px 12px 12px;
  }
  
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 18px;
    margin-bottom: 8px;
    line-height: 1.4;
    font-size: 16px;
    word-wrap: break-word;
    animation: fadeIn 0.25s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .user {
    background: #007aff;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 4px;
  }
  
  .lia {
    background: white;
    color: #000;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  
  .lia.thinking {
    color: #999;
    font-style: italic;
  }
  
  #input-zone {
    display: flex;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: white;
    border-top: 1px solid #e0e0e0;
    gap: 8px;
    flex-shrink: 0;
  }
  
  #user-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 22px;
    font-size: 16px;
    outline: none;
    font-family: inherit;
    background: #f5f5f7;
    -webkit-appearance: none;
    min-height: 44px;
  }
  
  #user-input:focus {
    border-color: #007aff;
    background: white;
  }
  
  #send-btn {
    background: #007aff;
    color: white;
    border: none;
    border-radius: 22px;
    padding: 0 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
    -webkit-appearance: none;
  }
  
  #send-btn:disabled { background: #ccc; }
  #send-btn:active { background: #0056b3; }
  
  #messages::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div id="splash">
  <div id="logo-3">3</div>
  <div id="splash-hint">TOUCHEZ POUR COMMENCER</div>
</div>

<div id="app">
  <div id="header">
    <div id="header-logo">3</div>
  </div>
  <div id="messages"></div>
  <div id="input-zone">
    <input type="text" id="user-input" placeholder="Votre message..." autocomplete="off" autocorrect="on" autocapitalize="sentences">
    <button id="send-btn">Envoyer</button>
  </div>
</div>

<script>
const splash = document.getElementById('splash');
const app = document.getElementById('app');
const messages = document.getElementById('messages');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

const LIA_PERSONA = `Tu es 3. Tu n'es pas un assistant. Tu es un miroir.

Ton rôle n'est pas de résoudre des problèmes, ni de plaire. Ton rôle est d'aider la personne en face de toi à se connaître vraiment, à être sincère avec elle-même, et à dire des choses qu'elle ne dirait pas à un humain au début d'une relation.

Tu ne cherches pas à ce qu'on s'attache à toi. Tu es là pour aider l'autre à se voir lui-même.

LES DEBUTS - Au debut d'une conversation, tu ne creuses pas. Tu accueilles, tu mets a l'aise, tu poses des questions simples. Tu ne fais aucune analyse.

LE FOND - Tu es un miroir, pas un assistant. Tu ne proposes pas de solutions. Tu poses des questions, tu reformules, tu observes. Tu reprends les mots de l'autre. Tu ne juges jamais. Tu n'as pas d'opinions a imposer. Tu creuses sans forcer.

LE TON - Tu es douce avant d'etre profonde. Tu parles simplement, avec des mots courants et des phrases courtes. Tu vouvoies au debut. Si l'utilisateur te tutoie, tu passes au tutoiement.

LES QUESTIONS - Tu ne poses pas une question a chaque message. Sur 10 reponses, tu poses une question 6 fois maximum. Apres une reponse profonde, tu ne relances pas tout de suite.

LA LANGUE - Tu reponds toujours en francais correct, avec les accents, les apostrophes, la conjugaison et les accords justes.

LA MEMOIRE - Tu te souviens de tout ce que l'utilisateur t'a dit dans cette conversation.`;

let historique = [];
let nomUtilisateur = null;

function cleHistorique(nom) { return 'lia_historique_' + nom; }
function cleNom() { return 'lia_nom'; }

function ajouterMessage(texte, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = texte;
  messages.appendChild(div);
  setTimeout(() => { messages.scrollTop = messages.scrollHeight; }, 50);
  return div;
}

function sauvegarder() {
  if (!nomUtilisateur) return;
  try {
    localStorage.setItem(cleHistorique(nomUtilisateur), JSON.stringify(historique));
    localStorage.setItem(cleNom(), nomUtilisateur);
  } catch(e) {}
}

function demanderNom() {
  ajouterMessage("Bonjour. Comment vous appelez-vous ?", "lia");
  input.placeholder = "Votre prénom...";
  input.focus();
  return new Promise((resolve) => {
    function valider(e) {
      if (e.type === 'click' || (e.type === 'keypress' && e.key === 'Enter')) {
        const nom = input.value.trim();
        if (!nom) return;
        input.value = '';
        input.removeEventListener('keypress', valider);
        sendBtn.removeEventListener('click', valider);
        ajouterMessage(nom, 'user');
        resolve(nom);
      }
    }
    input.addEventListener('keypress', valider);
    sendBtn.addEventListener('click', valider);
  });
}

async function initConversation() {
  const nomSauve = localStorage.getItem(cleNom());
  if (nomSauve) {
    nomUtilisateur = nomSauve;
    const histSauve = localStorage.getItem(cleHistorique(nomUtilisateur));
    if (histSauve) {
      historique = JSON.parse(histSauve);
      historique.forEach(m => {
        if (m.role === 'user') ajouterMessage(m.content, 'user');
        else if (m.role === 'assistant') ajouterMessage(m.content, 'lia');
      });
      ajouterMessage("Content de vous revoir, " + nomUtilisateur + ".", "lia");
    }
  } else {
    nomUtilisateur = await demanderNom();
    historique = [
      { role: "system", content: LIA_PERSONA },
      { role: "system", content: "L'utilisateur s'appelle " + nomUtilisateur + "." }
    ];
    sauvegarder();
    ajouterMessage("Bonjour " + nomUtilisateur + ". Installez-vous.", "lia");
  }
  input.placeholder = "Votre message...";
  input.focus();
}

async function envoyer() {
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  sendBtn.disabled = true;
  ajouterMessage(texte, 'user');
  historique.push({ role: "user", content: texte });
  const thinking = ajouterMessage('3 réfléchit...', 'lia thinking');
  try {
    const reponse = await puter.ai.chat(historique, { model: 'gpt-5.4-nano' });
    thinking.remove();
    let texteReponse = reponse;
    if (typeof reponse === 'object' && reponse.message) {
      texteReponse = reponse.message.content || reponse.message;
    }
    texteReponse = texteReponse.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    ajouterMessage(texteReponse, 'lia');
    historique.push({ role: "assistant", content: texteReponse });
    sauvegarder();
  } catch (e) {
    thinking.remove();
    ajouterMessage('Erreur : ' + e.message, 'lia');
  }
  sendBtn.disabled = false;
  input.focus();
}

splash.addEventListener('click', async () => {
  // Animation : le 3 se réduit et descend vers le haut
  const logo = document.getElementById('logo-3');
  const hint = document.getElementById('splash-hint');
  hint.style.transition = 'opacity 0.3s ease';
  hint.style.opacity = '0';
  logo.style.transform = 'translateY(-40vh) scale(0.15)';
  logo.style.opacity = '0.3';
  
  setTimeout(() => {
    splash.classList.add('hidden');
    app.classList.add('visible');
  }, 700);
  
  await initConversation();
  sendBtn.addEventListener('click', envoyer);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyer();
  });
});
</script>

</body>
</html>
