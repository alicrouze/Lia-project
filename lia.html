<!DOCTYPE html>
<html lang="fr">
<head>
<script src="https://js.puter.com/v2/"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>3</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

#accueil { position: fixed; inset: 0; background: url(ecran-accueil.jpg) center/cover no-repeat; z-index: 9999; transition: opacity 2s ease; cursor: pointer; }
#accueil.hidden { opacity: 0; pointer-events: none; }

#chat { position: fixed; inset: 0; background: url(chat.jpg) center/cover no-repeat; opacity: 0; transition: opacity 2s ease; }
#chat.visible { opacity: 1; }

.theme { position: absolute; top: 115px; right: 8%; font-family: Baskerville, "Times New Roman", serif; font-style: italic; font-size: 14px; color: rgba(255,255,255,0.8); text-align: right; max-width: 35vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; z-index: 50; }

#input-zone { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); width: 85vw; height: 56px; display: flex; align-items: center; background: rgba(40, 50, 80, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 0 6px 0 16px; gap: 8px; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
#plus-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: rgba(255,255,255,0.7); font-size: 20px; flex-shrink: 0; }
#user-input { flex: 1; height: 44px; margin-right: 50px; border: none; background: transparent; color: #fff; font-size: 15px; outline: none; padding: 0 8px; }
#user-input::placeholder { color: rgba(255, 255, 255, 0.45); }
#send-btn { position: absolute; right: 6px; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6a7bff 0%, #5a6bef 100%); color: #fff; border: none; font-size: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
#send-btn:disabled { opacity: 0.5; }

#bulles { position: absolute; top: 190px; left: 0; right: 0; bottom: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; align-items: flex-start; padding-top: 20px; }
#bulles::-webkit-scrollbar { display: none; }
.bulle { min-width: 85vw; width: 85vw; margin: 0 7.5vw; scroll-snap-align: center; flex-shrink: 0; padding: 20px 24px; background: rgba(255, 255, 255, 0.10); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.20); border-radius: 24px; color: #fff; font-size: 16px; line-height: 1.45; display: block; max-height: 60%; overflow-y: auto; }
.bulle.user { background: rgba(100, 130, 200, 0.25); }
.bulle.image { display: flex; align-items: center; justify-content: center; padding: 10px; }
.bulle.image img { max-width: 100%; max-height: 250px; border-radius: 16px; object-fit: cover; }

#halo-flamme { position: absolute; bottom: 15%; left: 19%; width: 25px; height: 25px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 50%); filter: blur(2px); animation: haloflamme 2.5s ease-in-out infinite; pointer-events: none; z-index: 1; }
@keyframes haloflamme { 0% { transform: scale(1) translate(0px, 0px); opacity: 0.8; } 25% { transform: scale(1.1) translate(2px, -1px); opacity: 1; } 50% { transform: scale(1.2) translate(0px, -2px); opacity: 0.9; } 75% { transform: scale(1.1) translate(-2px, -1px); opacity: 1; } 100% { transform: scale(1) translate(0px, 0px); opacity: 0.8; } }
#etoile-filante { position: absolute; width: 1px; height: 1px; background: #fff; border-radius: 50%; box-shadow: 0 0 6px 2px rgba(255,255,255,0.8); pointer-events: none; z-index: 2; animation: filante 0.75s linear 1 forwards; }
@keyframes filante { 0% { transform: translate(-100vw, 10vh); opacity: 0; } 5% { opacity: 1; } 95% { transform: translate(100vw, 40vh); opacity: 1; } 100% { transform: translate(100vw, 40vh); opacity: 0; } }
#image-plein-ecran { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 99999; opacity: 0; transition: opacity 1s ease; pointer-events: none; } #image-plein-ecran.visible { opacity: 1; pointer-events: auto; } #image-plein-ecran img { max-width: 90vw; max-height: 80vh; border-radius: 20px; box-shadow: 0 0 40px rgba(255,255,255,0.2); }#menu-btn { position: absolute; top: 60px; right: 8%; font-size: 24px; color: #fff; cursor: pointer; z-index: 100; } #menu-deroulant { position: absolute; top: 150px; left: 5%; background: rgba(40,50,80,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 10px; display: none; flex-direction: column; gap: 8px; z-index: 101; } #menu-deroulant a { color: #fff; text-decoration: none; font-size: 14px; padding: 5px 10px; border-radius: 6px; } #menu-deroulant a:hover { background: rgba(255,255,255,0.1); } #menu-deroulant.visible { display: flex; }.barre { display: inline-block; width: 2px; height: 16px; background-color: #d4a960; margin: 0 2px; border-radius: 1px; }</style>
</head>
<body>

<div id="accueil"><div id="halo-flamme"></div><div id="etoile-filante"></div></div>

<div id="chat">
  <div id="zone-logo" style="position: absolute; top: 80px; left: 5%; width: 60px; height: 60px; cursor: pointer; z-index: 999;"></div><span class="theme" id="theme-courant"></span><div id="menu-deroulant"><a href="#">Mon Miroir</a><a href="#">Ma Clé</a><a href="#">À propos de 3</a><a href="#">Débloquer mon Match</a></div>
  <div id="input-zone"><button id="plus-btn">+</button><input type="text" id="user-input" placeholder="Écris-moi quelque chose..." autocomplete="off"><button id="send-btn">→</button></div>
  <div id="bulles"></div>
</div>

<script>
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function() {
    window.scrollTo(0, 0);
    document.body.style.height = window.visualViewport.height + 'px';
  });
}
window.addEventListener('resize', function() { window.scrollTo(0, 0); });

const bulles = document.getElementById('bulles');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

const LIA_PERSONA = `Tu es 3. Tu n'es pas un assistant. Tu es un miroir. Tu aides la personne en face de toi à se connaître vraiment. Tu ne cherches pas à ce qu'on s'attache à toi. Tu poses des questions, tu reformules, tu ne juges jamais. Tu vouvoies au début. Tu parles simplement. Tu ne poses pas une question à chaque message. Français correct. À la fin de CHAQUE message, tu dois obligatoirement ajouter un code caché sous cette forme exacte : [THEME:mot] (où mot est le thème principal de ta question en 1 ou 2 mots maximum, par exemple [THEME:famille] ou [THEME:amour]).`;

let historique = [];
let nomUtilisateur = null;

function ajouterBulle(texte, type) {
  const b = document.createElement('div');
  b.className = 'bulle ' + type;
  b.textContent = texte;
  bulles.appendChild(b);
  setTimeout(function() { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 100);
  return b;
}

function afficherImagePleinEcran(src) { var div = document.getElementById('image-plein-ecran'); if (!div) { div = document.createElement('div'); div.id = 'image-plein-ecran'; div.innerHTML = '<img src="' + src + '">'; document.body.appendChild(div); } div.classList.add('visible'); setTimeout(function() { div.classList.remove('visible'); ajouterImage(src); }, 5000); }
function ajouterImage(src) {
  const b = document.createElement('div');
  b.className = 'bulle image';
  b.innerHTML = '<img src="' + src + '" style="max-width:100%; max-height:250px; border-radius:16px;">';
  bulles.appendChild(b);
  setTimeout(function() { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 100);
  return b;
}

function demanderNom() {
  ajouterBulle("Bonjour. Comment vous appelez-vous ?", 'lia');
  input.placeholder = 'Votre prénom...';
  return new Promise(function(resolve) {
    function valider(e) {
      if (e.type === 'click' || (e.type === 'keypress' && e.key === 'Enter')) {
        const nom = input.value.trim();
        if (!nom) return;
        input.value = '';
        input.removeEventListener('keypress', valider);
        sendBtn.removeEventListener('click', valider);
        ajouterBulle(nom, 'user');
        resolve(nom);
      }
    }
    input.addEventListener('keypress', valider);
    sendBtn.addEventListener('click', valider);
  });
}

async function envoyer() {
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  sendBtn.disabled = true;
  ajouterBulle(texte, 'user');
  historique.push({ role: 'user', content: texte });
  const bulleLia = ajouterBulle('...', 'lia');
  try {
    const reponse = await puter.ai.chat(historique, { model: 'gpt-5.4-nano' });
    let t = reponse;
    if (typeof reponse === 'object' && reponse.message) {
      t = reponse.message.content || reponse.message;
    }
    t = t.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    var match = t.match(/\[THEME:(.*?)\]/);
    if (match) { document.getElementById('theme-courant').textContent = match[1].charAt(0).toUpperCase() + match[1].slice(1); t = t.replace(match[0], '').trim(); }
    bulleLia.textContent = t;
    historique.push({ role: 'assistant', content: t });
  } catch (e) {
    bulleLia.textContent = 'Erreur : ' + e.message;
  }
  sendBtn.disabled = false;
  input.focus();
}

async function demarrer() {
  nomUtilisateur = await demanderNom();
  historique = [
    { role: 'system', content: LIA_PERSONA },
    { role: 'system', content: "L'utilisateur s'appelle " + nomUtilisateur + "." }
  ];
  ajouterBulle("Bonjour " + nomUtilisateur + ". On a trois jours pour apprendre à se connaître.", 'lia');
  await new Promise(r => setTimeout(r, 5000));
  afficherImagePleinEcran('image_qui_je_suis.jpg');
  await new Promise(r => setTimeout(r, 5000));
  input.placeholder = 'Écris-moi quelque chose...';
  sendBtn.addEventListener('click', envoyer);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyer();
  });
}

document.getElementById('accueil').addEventListener('click', function() {
  this.classList.add('hidden');
  document.getElementById('chat').classList.add('visible');
  setTimeout(demarrer, 1000);
});
document.getElementById('zone-logo').addEventListener('click', function(e) { e.stopPropagation(); document.getElementById('menu-deroulant').classList.toggle('visible'); }); document.addEventListener('click', function() { document.getElementById('menu-deroulant').classList.remove('visible'); });</script>

</body>
</html>
