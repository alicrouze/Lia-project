<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>3</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    width: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none;
  }
  
  #app {
    display: none;
    flex-direction: column;
    height: 100%;
    background: #f5f5f7;
  }
  
  #app.visible {
    display: flex;
  }
  
  /* BANDEAU */
  #header {
    background: #2a3155;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    flex-shrink: 0;
    z-index: 100;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
  }
  
  #header-logo {
    font-size: 48px;
    font-weight: 200;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255, 100, 120, 1), 0 0 50px rgba(255, 80, 100, 0.9), 0 0 100px rgba(255, 60, 80, 0.7);
    animation: headerPulse 4s ease-in-out infinite;
    font-family: Didot, 'Bodoni 72', Baskerville, serif;
  }
  
  @keyframes headerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  
  /* SOUS-BANDEAU */
  #subheader {
    background: #3a4570;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
    flex-shrink: 0;
    color: #fff;
    font-family: Didot, 'Bodoni 72', Baskerville, serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    position: fixed;
    top: 80px;
    left: 0;
    right: 0;
    z-index: 99;
  }
  
  #jour { color: #fff; }
  #theme { color: rgba(255,255,255,0.6); }
  
  /* CONTENEUR SWIPE */
  #swipe-container {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    margin-top: 100px;
  }
  
  #swipe-container::-webkit-scrollbar { display: none; }
  
  .ecran {
    min-width: 100vw;
    width: 100vw;
    height: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 30px 24px;
    padding-top: 120px;
    scroll-snap-align: start;
    flex-shrink: 0;
    overflow-y: auto;
  }
  
  .ecran.lia {
    background: #1a1f3a;
    background-image: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.08) 1px, transparent 1px), radial-gradient(circle at 70% 60%, rgba(255,255,255,0.06) 1px, transparent 1px), radial-gradient(circle at 50% 80%, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 200px 200px, 300px 300px, 400px 400px;
  }
  
  .ecran.user {
    background: #e5e5e7;
  }
  
  .texte-lia {
    color: #fff;
    font-family: Didot, 'Bodoni 72', Baskerville, serif;
    font-size: 20px;
    line-height: 1.8;
    text-align: center;
    max-width: 90%;
    text-shadow: 0 0 15px rgba(255,255,255,0.3);
  }
  
  .texte-user {
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    text-align: center;
    max-width: 90%;
  }
  
  .curseur {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #fff;
    animation: clignote 0.8s infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
  }
  
  @keyframes clignote {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  
  /* ZONE DE SAISIE */
  #input-zone {
    display: flex;
    padding: 10px 12px;
    background: #fff;
    border-top: 1px solid #e0e0e0;
    gap: 8px;
    flex-shrink: 0;
  }
  
  #user-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 22px;
    font-size: 16px;
    outline: none;
    background: #f5f5f7;
    -webkit-appearance: none;
  }
  
  #user-input:focus { border-color: #1d1d1f; background: #fff; }
  
  #send-btn {
    background: #2a3155;
    color: #fff;
    border: none;
    border-radius: 22px;
    padding: 0 22px;
    font-family: Didot, 'Bodoni 72', Baskerville, serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    min-height: 44px;
    cursor: pointer;
    -webkit-appearance: none;
    text-shadow: 0 0 10px rgba(255, 100, 120, 1), 0 0 25px rgba(255, 80, 100, 0.8);
  }
  
  #send-btn:disabled { opacity: 0.5; }
  
  /* INDICATEUR DE POINTS */
  #dots {
    position: fixed;
    bottom: 75px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 6px;
    z-index: 50;
    pointer-events: none;
  }
  
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(0,0,0,0.2);
    transition: all 0.3s;
  }
  
  .dot.active {
    background: #2a3155;
    width: 20px;
    border-radius: 3px;
  }

  #accueil {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #5a6b9e 0%, #4a5a8a 70%, #3a4a75 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
    transition: opacity 4s ease;
    cursor: pointer;
  }
  #accueil.hidden { opacity: 0; pointer-events: none; }
  #logo-3 {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32vh;
    font-weight: 500;
    color: #fff;
    line-height: 1;
    text-shadow: 0 0 30px rgba(255, 100, 120, 1), 0 0 90px rgba(255, 80, 100, 0.8), 0 0 180px rgba(255, 60, 80, 0.6);
    animation: pulse 4s ease-in-out infinite;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    letter-spacing: 0;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  #accueil-hint {
    position: absolute;
    bottom: 12%;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    letter-spacing: 0.15em;
  }
  #concept {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #5a6b9e 0%, #4a5a8a 70%, #3a4a75 100%);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9998;
    padding: 20px 30px;
    text-align: center;
  }
  #concept.visible { display: flex; }
  #concept-texte {
    color: #fff;
    font-family: Didot, Baskerville, serif;
    font-size: 18px;
    line-height: 2.2;
    max-width: 550px;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
  }
  #concept-btn {
    background: transparent;
    color: rgba(255,255,255,0.7);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    padding: 14px 40px;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-family: Didot, Baskerville, serif;
    cursor: pointer;
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
  }

</style>
</head>
<body>


<div id="accueil">
  <div id="logo-3">
<svg viewBox="0 0 200 260" style="width:60vh;height:auto;">
  <path d="M 60 40 Q 60 20 80 20 L 120 20 Q 140 20 140 40 Q 140 60 120 60 L 95 60 L 95 120 L 120 120 Q 140 120 140 140 Q 140 160 120 160 L 80 160 Q 60 160 60 140 Q 60 120 80 120 L 105 120 L 105 60 L 80 60 Q 60 60 60 40 Z" fill="#fff"/>
</svg>
</div>
  <div id="accueil-hint">TOUCHEZ POUR COMMENCER</div>
</div>

<div id="concept">
  <div id="concept-texte">
    PENDANT <em>3 JOURS</em>, ON VA PARLER.<br><br>
    PAS DE PHOTOS.<br>
    PAS DE PROFILS.<br>
    JUSTE TOI ET MOI.<br><br>
    À LA FIN, JE TE PROPOSERAI UNE SEULE PERSONNE.
  </div>
  <button id="concept-btn">COMMENCER</button>
</div>

<div id="app">
  <div id="header">
    <div id="header-logo">
<svg viewBox="0 0 200 260" style="width:48px;height:auto;">
  <path d="M 60 40 Q 60 20 80 20 L 120 20 Q 140 20 140 40 Q 140 60 120 60 L 95 60 L 95 120 L 120 120 Q 140 120 140 140 Q 140 160 120 160 L 80 160 Q 60 160 60 140 Q 60 120 80 120 L 105 120 L 105 60 L 80 60 Q 60 60 60 40 Z" fill="#fff"/>
</svg>
</div>
  </div>
  <div id="subheader">
    <div id="jour">JOUR 1 / 3</div>
    <div id="theme">AMOUR</div>
  </div>
  <div id="swipe-container">
    <!-- Les ecrans seront ajoutes ici par le JS -->
  </div>
  <div id="input-zone">
    <input type="text" id="user-input" placeholder="Votre message..." autocomplete="off">
    <button id="send-btn">ENVOYER</button>
  </div>
</div>

<div id="dots"></div>

<script>
const container = document.getElementById('swipe-container');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const dotsContainer = document.getElementById('dots');

const LIA_PERSONA = `Tu es 3. Tu n'es pas un assistant. Tu es un miroir.

Ton rôle n'est pas de résoudre des problèmes, ni de plaire. Ton rôle est d'aider la personne en face de toi à se connaître vraiment, à être sincère avec elle-même.

Tu ne cherches pas à ce qu'on s'attache à toi.

LES DEBUTS - Au début, tu ne creuses pas. Tu accueilles, tu mets à l'aise.

LE FOND - Tu poses des questions, tu reformules. Tu reprends les mots de l'autre. Tu ne juges jamais. Tu creuses sans forcer.

LE TON - Tu es douce avant d'être profonde. Tu parles simplement. Tu vouvoies au début.

LES QUESTIONS - Tu ne poses pas une question à chaque message.

LA LANGUE - Français correct, avec accents et apostrophes.

LE THEME - À la fin de chaque réponse, ajoute [THEME: xxx] où xxx est AMOUR, FAMILLE, PEURS, VALEURS, CORPS, CONTRADICTIONS, ou SOI. Ce marqueur sera retiré avant l'affichage.`;

let historique = [];
let nomUtilisateur = null;
let ecrans = [];

// Ajouter un ecran
function ajouterEcran(texte, type) {
  const ecran = document.createElement('div');
  ecran.className = 'ecran ' + type;
  const p = document.createElement('div');
  p.className = type === 'lia' ? 'texte-lia' : 'texte-user';
  p.textContent = texte;
  ecran.appendChild(p);
  container.appendChild(ecran);
  ecrans.push({ texte: texte, type: type });
  
  // Scroll vers le nouvel ecran
  setTimeout(function() {
    ecran.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'end' });
  }, 100);
  
  mettreAJourDots();
  return p;
}

// Streaming : écrire lettre par lettre
function streamer(paragraphe, texte, callback) {
  let i = 0;
  const vitesse = 25;
  paragraphe.innerHTML = '';
  const curseur = document.createElement('span');
  curseur.className = 'curseur';
  paragraphe.appendChild(curseur);
  
  function suivant() {
    if (i < texte.length) {
      curseur.insertAdjacentText('beforebegin', texte[i]);
      i++;
      container.scrollLeft = container.scrollWidth;
      setTimeout(suivant, vitesse);
    } else {
      curseur.remove();
      if (callback) callback();
    }
  }
  suivant();
}

// Mettre a jour les dots
function mettreAJourDots() {
  dotsContainer.innerHTML = '';
  const max = Math.min(ecrans.length, 10);
  for (let i = 0; i < max; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    if (i === ecrans.length - 1) dot.classList.add('active');
    dotsContainer.appendChild(dot);
  }
}

// Sauvegarder
function sauvegarder() {
  if (!nomUtilisateur) return;
  try {
    localStorage.setItem('lia_historique_' + nomUtilisateur, JSON.stringify(ecrans));
    localStorage.setItem('lia_nom', nomUtilisateur);
  } catch(e) {}
}

// Charger
function charger() {
  const nom = localStorage.getItem('lia_nom');
  if (!nom) return false;
  nomUtilisateur = nom;
  const hist = localStorage.getItem('lia_historique_' + nom);
  if (hist) {
    ecrans = JSON.parse(hist);
    ecrans.forEach(function(e) {
      const ecran = document.createElement('div');
      ecran.className = 'ecran ' + e.type;
      const p = document.createElement('div');
      p.className = e.type === 'lia' ? 'texte-lia' : 'texte-user';
      p.textContent = e.texte;
      ecran.appendChild(p);
      container.appendChild(ecran);
    });
    mettreAJourDots();
    return true;
  }
  return false;
}

// Envoyer
async function envoyer() {
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  sendBtn.disabled = true;
  
  ajouterEcran(texte, 'user');
  historique.push({ role: 'user', content: texte });
  
  // Ecran de LIA (vide au debut)
  const paragraphe = ajouterEcran('', 'lia');
  
  try {
    const reponse = await puter.ai.chat(historique, { model: 'gpt-5.4-nano' });
    let texteReponse = reponse;
    if (typeof reponse === 'object' && reponse.message) {
      texteReponse = reponse.message.content || reponse.message;
    }
    texteReponse = texteReponse.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    
    // Extraire le theme
    const matchTheme = texteReponse.match(/\[THEME:\s*([A-Z]+)\]/i);
    if (matchTheme) {
      document.getElementById('theme').textContent = matchTheme[1].toUpperCase();
      texteReponse = texteReponse.replace(/\[THEME:\s*[A-Z]+\]/gi, '').trim();
    }
    
    // Streaming
    streamer(paragraphe, texteReponse, function() {
      historique.push({ role: 'assistant', content: texteReponse });
      ecrans[ecrans.length - 1].texte = texteReponse;
      sauvegarder();
      sendBtn.disabled = false;
      input.focus();
    });
    
  } catch (e) {
    paragraphe.textContent = 'Erreur : ' + e.message;
    sendBtn.disabled = false;
  }
}

// Demander le nom
function demanderNom() {
  ajouterEcran("Bonjour. Comment vous appelez-vous ?", 'lia');
  input.placeholder = 'Votre prénom...';
  
  return new Promise(function(resolve) {
    function valider(e) {
      if (e.type === 'click' || (e.type === 'keypress' && e.key === 'Enter')) {
        const nom = input.value.trim();
        if (!nom) return;
        input.value = '';
        input.removeEventListener('keypress', valider);
        sendBtn.removeEventListener('click', valider);
        ajouterEcran(nom, 'user');
        resolve(nom);
      }
    }
    input.addEventListener('keypress', valider);
    sendBtn.addEventListener('click', valider);
  });
}

// Initialisation
async function init() {
  const charge = charger();
  if (!charge) {
    nomUtilisateur = await demanderNom();
    historique = [
      { role: 'system', content: LIA_PERSONA },
      { role: 'system', content: "L'utilisateur s'appelle " + nomUtilisateur + "." }
    ];
    ajouterEcran("Bonjour " + nomUtilisateur + ". Installez-vous.", 'lia');
    sauvegarder();
  } else {
    historique = [{ role: 'system', content: LIA_PERSONA }];
    ecrans.forEach(function(e) {
      if (e.type === 'user') historique.push({ role: 'user', content: e.texte });
      else historique.push({ role: 'assistant', content: e.texte });
    });
  }
  input.placeholder = 'Votre message...';
  input.focus();
  
  // Ecouter les changements
  sendBtn.addEventListener('click', envoyer);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyer();
  });
}


document.getElementById('accueil').addEventListener('click', function() {
  this.classList.add('hidden');
  setTimeout(function() {
    document.getElementById('concept').classList.add('visible');
  }, 1200);
});

document.getElementById('concept-btn').addEventListener('click', function() {
  document.getElementById('concept').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  init();
});

</script>

</body>
</html>
