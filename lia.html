<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>3</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  
  #accueil {
    position: fixed;
    inset: 0;
    background: url('ecran-accueil.jpg') center/cover no-repeat;
    z-index: 9999;
    transition: opacity 2s ease;
    cursor: pointer;
  }
  #accueil.hidden { opacity: 0; pointer-events: none; }
  
  #chat {
    position: fixed;
    inset: 0;
    background: url('chat.jpg') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #chat.visible { opacity: 1; }
  
  #indicateur {
    position: absolute;
    top: 19%;
    left: 8%;
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 50;
  }
  #indicateur.visible { opacity: 1; }
  #indicateur .point3 {
    font-size: 18px;
    color: #fff;
    opacity: 0.3;
    font-family: -apple-system, sans-serif;
    animation: vague 1.8s ease-in-out infinite;
  }
  #indicateur .point3:nth-child(1) { animation-delay: 0s; }
  #indicateur .point3:nth-child(2) { animation-delay: 0.3s; }
  #indicateur .point3:nth-child(3) { animation-delay: 0.6s; }
  @keyframes vague {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  
  #bulles {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    margin-top: 120px;
    margin-bottom: 110px;
    align-items: flex-start;
    padding-top: 20px;
  }
  #bulles::-webkit-scrollbar { display: none; }
  
  .bulle {
    min-width: calc(100vw - 80px);
    width: calc(100vw - 80px);
    margin: 0 40px;
    scroll-snap-align: center;
    flex-shrink: 0;
    padding: 20px 24px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.20);
    border-radius: 24px;
    color: #fff;
    font-size: 16px;
    line-height: 1.45;
    display: flex;
    align-items: center;
    align-self: center;
    max-height: 60%;
    overflow-y: auto;
    animation: remonte 0.5s ease-out;
  }
  @keyframes remonte {
    from { transform: translateY(40px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .bulle.user { background: rgba(100, 130, 200, 0.25); }
  
  #input-zone {
    position: fixed;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    width: 85vw;
    height: 56px;
    display: flex;
    align-items: center;
    background: rgba(40, 50, 80, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 28px;
    padding: 0 6px 0 16px;
    gap: 8px;
    z-index: 100;
  }
  #plus-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: rgba(255,255,255,0.7); font-size: 20px; cursor: pointer; }
  #user-input { flex: 1; height: 44px; border: none; background: transparent; color: #fff; font-size: 15px; outline: none; -webkit-appearance: none; padding: 0 8px; }
  #user-input::placeholder { color: rgba(255, 255, 255, 0.45); }
  #mic-btn { width: 32px; height: 32px; background: transparent; border: none; color: rgba(255,255,255,0.6); font-size: 18px; cursor: pointer; }
  #send-btn { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6a7bff 0%, #5a6bef 100%); color: #fff; border: none; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>

<div id="accueil"></div>

<div id="chat">
  <div id="indicateur"><span class="point3">3</span><span class="point3">3</span><span class="point3">3</span></div>
  <div id="bulles"></div>
  <div id="input-zone">
    <button id="plus-btn">+</button>
    <input type="text" id="user-input" placeholder="Écris-moi quelque chose..." autocomplete="off">
    <button id="mic-btn">🎤</button>
    <button id="send-btn">→</button>
  </div>
</div>

<script>
const bulles = document.getElementById('bulles');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const indicateur = document.getElementById('indicateur');

const LIA_PERSONA = "Tu es 3. Tu n'es pas un assistant. Tu es un miroir. Tu aides la personne en face de toi a se connaitre vraiment. Tu ne cherches pas a ce qu'on s'attache a toi. Tu poses des questions, tu reformules, tu ne juges jamais. Tu vouvoies au debut. Tu parles simplement. Tu ne poses pas une question a chaque message. Francais correct.";

let historique = [];
let nomUtilisateur = null;

function ajouterBulle(texte, type) {
  const b = document.createElement('div');
  b.className = 'bulle ' + type;
  b.textContent = texte;
  bulles.appendChild(b);
  setTimeout(function() { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 100);
  return b;
}

function demanderNom() {
  ajouterBulle("Bonjour. Comment vous appelez-vous ?", 'lia');
  input.placeholder = 'Votre prénom...';
  return new Promise(function(resolve) {
    function valider(e) {
      if (e.type === 'click' || (e.type === 'keypress' && e.key === 'Enter')) {
        const nom = input.value.trim();
        if (!nom) return;
        input.value = '';
        input.removeEventListener('keypress', valider);
        sendBtn.removeEventListener('click', valider);
        ajouterBulle(nom, 'user');
        resolve(nom);
      }
    }
    input.addEventListener('keypress', valider);
    sendBtn.addEventListener('click', valider);
  });
}

async function envoyer() {
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  sendBtn.disabled = true;
  ajouterBulle(texte, 'user');
  historique.push({ role: 'user', content: texte });
  indicateur.classList.add('visible');
  try {
    const reponse = await puter.ai.chat(historique, { model: 'gpt-5.4-nano' });
    let t = reponse;
    if (typeof reponse === 'object' && reponse.message) {
      t = reponse.message.content || reponse.message;
    }
    t = t.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    indicateur.classList.remove('visible');
    ajouterBulle(t, 'lia');
    historique.push({ role: 'assistant', content: t });
  } catch (e) {
    indicateur.classList.remove('visible');
    ajouterBulle('Erreur : ' + e.message, 'lia');
  }
  sendBtn.disabled = false;
  input.focus();
}

async function demarrer() {
  nomUtilisateur = await demanderNom();
  historique = [
    { role: 'system', content: LIA_PERSONA },
    { role: 'system', content: "L'utilisateur s'appelle " + nomUtilisateur + "." }
  ];
  ajouterBulle("Bonjour " + nomUtilisateur + ". On a trois jours pour apprendre à se connaître.", 'lia');
  input.placeholder = 'Écris-moi quelque chose...';
  sendBtn.addEventListener('click', envoyer);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyer();
  });
}

document.getElementById('accueil').addEventListener('click', function() {
  this.classList.add('hidden');
  document.getElementById('chat').classList.add('visible');
  setTimeout(demarrer, 1000);
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function() {
    window.scrollTo(0, 0);
  });
}
</script>

</body>
</html>
