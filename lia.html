<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>3</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; position: fixed; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  
  /* ECRAN ACCUEIL */
  #accueil {
    position: fixed;
    inset: 0;
    background: url('ecran-accueil.jpg') center/cover no-repeat;
    z-index: 9999;
    transition: opacity 2s ease;
    cursor: pointer;
  }
  #accueil.hidden { opacity: 0; pointer-events: none; }
  
  /* CHAT */
  #chat {
    position: fixed;
    inset: 0;
    background: url('ecran-chat.jpg') center/cover no-repeat;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 2s ease;
  }
  #chat.visible { opacity: 1; }
  
  /* BULLES */
  #bulles {
    flex: 1;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
    margin-top: 130px;
    margin-bottom: 100px;
  }
  #bulles::-webkit-scrollbar { display: none; }
  
  .bulle {
    min-width: calc(100vw - 80px);
    width: calc(100vw - 80px);
    margin: 0 40px;
    scroll-snap-align: center;
    flex-shrink: 0;
    padding: 20px 24px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.20);
    border-radius: 24px;
    color: #fff;
    font-size: 16px;
    line-height: 1.45;
    display: flex;
    align-items: center;
    align-self: center;
    max-height: 60%;
    overflow-y: auto;
    margin-top: auto;
    margin-bottom: auto;
  }
  
  .bulle.user {
    background: rgba(100, 130, 200, 0.25);
  }
  
  /* ZONE DE SAISIE */









  #input-zone {
    position: fixed;
    bottom: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 78vw;
    height: 50px;
    display: flex;
    align-items: center;
    z-index: 100;
  }
  #user-input {
    flex: 1;
    height: 50px;
    padding: 0 60px 0 60px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    outline: none;
    background: transparent;
    color: #fff;
    -webkit-appearance: none;
  }
  #user-input::placeholder { color: rgba(255, 255, 255, 0.55); }
  #send-btn {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: transparent;
    color: transparent;
    border: none;
    cursor: pointer;
    z-index: 101;
  }

</style>
</head>
<body>

<div id="accueil"></div>

<div id="chat">
  <div id="bulles"></div>
  <div id="input-zone"><input type="text" id="user-input" placeholder="Écris-moi quelque chose..." autocomplete="off"><button id="send-btn">→</button></div>
</div>

<script>
const bulles = document.getElementById('bulles');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

const LIA_PERSONA = `Tu es 3. Tu n'es pas un assistant. Tu es un miroir. Tu aides la personne en face de toi à se connaître vraiment. Tu ne cherches pas à ce qu'on s'attache à toi. Tu poses des questions, tu reformules, tu ne juges jamais. Tu vouvoies au début. Tu parles simplement. Tu ne poses pas une question à chaque message. Français correct.`;

let historique = [];
let nomUtilisateur = null;

function ajouterBulle(texte, type) {
  const b = document.createElement('div');
  b.className = 'bulle ' + type;
  b.textContent = texte;
  bulles.appendChild(b);
  setTimeout(function() { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 100);
  return b;
}

function demanderNom() {
  ajouterBulle("Bonjour. Comment vous appelez-vous ?", 'lia');
  input.placeholder = 'Votre prénom...';
  return new Promise(function(resolve) {
    function valider(e) {
      if (e.type === 'click' || (e.type === 'keypress' && e.key === 'Enter')) {
        const nom = input.value.trim();
        if (!nom) return;
        input.value = '';
        input.removeEventListener('keypress', valider);
        sendBtn.removeEventListener('click', valider);
        ajouterBulle(nom, 'user');
        resolve(nom);
      }
    }
    input.addEventListener('keypress', valider);
    sendBtn.addEventListener('click', valider);
  });
}

async function envoyer() {
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  sendBtn.disabled = true;
  ajouterBulle(texte, 'user');
  historique.push({ role: 'user', content: texte });
  const bulleLia = ajouterBulle('...', 'lia');
  try {
    const reponse = await puter.ai.chat(historique, { model: 'gpt-5.4-nano' });
    let t = reponse;
    if (typeof reponse === 'object' && reponse.message) {
      t = reponse.message.content || reponse.message;
    }
    t = t.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    bulleLia.textContent = t;
    historique.push({ role: 'assistant', content: t });
  } catch (e) {
    bulleLia.textContent = 'Erreur : ' + e.message;
  }
  sendBtn.disabled = false;
  input.focus();
}

async function demarrer() {
  nomUtilisateur = await demanderNom();
  historique = [
    { role: 'system', content: LIA_PERSONA },
    { role: 'system', content: "L'utilisateur s'appelle " + nomUtilisateur + "." }
  ];
  ajouterBulle("Bonjour " + nomUtilisateur + ". On a trois jours pour apprendre à se connaître.", 'lia');
  input.placeholder = 'Écris-moi quelque chose...';
  sendBtn.addEventListener('click', envoyer);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyer();
  });
}

document.getElementById('accueil').addEventListener('click', function() {
  this.classList.add('hidden');
  document.getElementById('chat').classList.add('visible');
  setTimeout(demarrer, 1000);
});
</script>

</body>
</html>
