<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>3</title>
<script src="https://js.puter.com/v2/"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

#accueil { position: fixed; inset: 0; background: url(ecran-accueil.jpg) center/cover no-repeat; z-index: 9999; transition: opacity 2s ease; cursor: pointer; }
#accueil.hidden { opacity: 0; pointer-events: none; }

#chat { position: fixed; inset: 0; background: url(chat.jpg) center/cover no-repeat; opacity: 0; transition: opacity 2s ease; }
#chat.visible { opacity: 1; }

#indicateur { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 6px; z-index: 50; width: 85vw; }
#indicateur.visible { display: flex; }
#indicateur .logo-mini { font-size: 22px; color: #d4a960; margin-right: 6px; }
#indicateur .logo-333 { font-size: 11px; color: rgba(212, 169, 96, 0.8); margin-right: 10px; }
#indicateur .logo-333.recherche { animation: clignote 0.8s ease-in-out infinite; }
#indicateur .point3 { font-size: 18px; color: #fff; opacity: 0.3; animation: vague 1.8s ease-in-out infinite; }
#indicateur .point3:nth-child(3) { animation-delay: 0s; }
#indicateur .point3:nth-child(4) { animation-delay: 0.3s; }
#indicateur .point3:nth-child(5) { animation-delay: 0.6s; }
#indicateur .theme { margin-left: auto; font-family: Georgia, serif; font-style: italic; font-size: 11px; color: rgba(255,255,255,0.6); text-align: right; max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@keyframes vague { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@keyframes clignote { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

#input-zone { position: absolute; top: 150px; left: 50%; transform: translateX(-50%); width: 85vw; height: 56px; display: flex; align-items: center; background: rgba(40, 50, 80, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 28px; padding: 0 6px 0 16px; gap: 8px; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
#plus-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: rgba(255,255,255,0.7); font-size: 20px; flex-shrink: 0; }
#user-input { flex: 1; height: 44px; margin-right: 50px; border: none; background: transparent; color: #fff; font-size: 15px; outline: none; padding: 0 8px; }
#user-input::placeholder { color: rgba(255, 255, 255, 0.45); }
#send-btn { position: absolute; right: 6px; width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #6a7bff 0%, #5a6bef 100%); color: #fff; border: none; font-size: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
#send-btn:disabled { opacity: 0.5; }

#bulles { position: absolute; top: 190px; left: 0; right: 0; bottom: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; align-items: flex-start; padding-top: 20px; }
#bulles::-webkit-scrollbar { display: none; }
.bulle { min-width: calc(100vw - 80px); width: calc(100vw - 80px); margin: 0 40px; scroll-snap-align: center; flex-shrink: 0; padding: 20px 24px; background: rgba(255, 255, 255, 0.10); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.20); border-radius: 24px; color: #fff; font-size: 16px; line-height: 1.45; display: flex; align-items: center; max-height: 60%; overflow-y: auto; }
.bulle.user { background: rgba(100, 130, 200, 0.25); }
</style>
</head>
<body>

<div id="accueil"></div>

<div id="chat">
  
  <div id="input-zone"><button id="plus-btn">+</button><input type="text" id="user-input" placeholder="Écris-moi quelque chose..." autocomplete="off"><button id="send-btn">→</button></div>
  <div id="bulles"></div>
</div>

<script>
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', function() {
    window.scrollTo(0, 0);
    document.body.style.height = window.visualViewport.height + 'px';
  });
}
window.addEventListener('resize', function() { window.scrollTo(0, 0); });

function faireClignoter(actif) {
  var el = document.getElementById("logo-333");
  if (!el) return;
  if (actif) el.classList.add("recherche");
  else el.classList.remove("recherche");
}

const bulles = document.getElementById('bulles');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

const LIA_PERSONA = `Tu es 3. Tu n'es pas un assistant. Tu es un miroir. Tu aides la personne en face de toi à se connaître vraiment. Tu ne cherches pas à ce qu'on s'attache à toi. Tu poses des questions, tu reformules, tu ne juges jamais. Tu vouvoies au début. Tu parles simplement. Tu ne poses pas une question à chaque message. Français correct.`;

let historique = [];
let nomUtilisateur = null;

function ajouterBulle(texte, type) {
  const b = document.createElement('div');
  b.className = 'bulle ' + type;
  b.textContent = texte;
  bulles.appendChild(b);
  setTimeout(function() { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); }, 100);
  return b;
}

function demanderNom() {
  ajouterBulle("Bonjour. Comment vous appelez-vous ?", 'lia');
  input.placeholder = 'Votre prénom...';
  return new Promise(function(resolve) {
    function valider(e) {
      if (e.type === 'click' || (e.type === 'keypress' && e.key === 'Enter')) {
        const nom = input.value.trim();
        if (!nom) return;
        input.value = '';
        input.removeEventListener('keypress', valider);
        sendBtn.removeEventListener('click', valider);
        ajouterBulle(nom, 'user');
        resolve(nom);
      }
    }
    input.addEventListener('keypress', valider);
    sendBtn.addEventListener('click', valider);
  });
}

async function envoyer() {
  const texte = input.value.trim();
  if (!texte) return;
  input.value = '';
  sendBtn.disabled = true;
  ajouterBulle(texte, 'user');
  historique.push({ role: 'user', content: texte });
  faireClignoter(true);
  const bulleLia = ajouterBulle('...', 'lia');
  try {
    const reponse = await puter.ai.chat(historique, { model: 'gpt-5.4-nano' });
    let t = reponse;
    if (typeof reponse === 'object' && reponse.message) {
      t = reponse.message.content || reponse.message;
    }
    t = t.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    bulleLia.textContent = t;
    historique.push({ role: 'assistant', content: t });
  } catch (e) {
    bulleLia.textContent = 'Erreur : ' + e.message;
  }
  faireClignoter(false);
  sendBtn.disabled = false;
  input.focus();
}

async function demarrer() {
  nomUtilisateur = await demanderNom();
  historique = [
    { role: 'system', content: LIA_PERSONA },
    { role: 'system', content: "L'utilisateur s'appelle " + nomUtilisateur + "." }
  ];
  
  ajouterBulle("Bonjour " + nomUtilisateur + ". On a trois jours pour apprendre à se connaître.", 'lia');
  input.placeholder = 'Écris-moi quelque chose...';
  sendBtn.addEventListener('click', envoyer);
  input.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') envoyer();
  });
}

document.getElementById('accueil').addEventListener('click', function() {
  this.classList.add('hidden');
  document.getElementById('chat').classList.add('visible');
  setTimeout(demarrer, 1000);
});
</script>

</body>
</html>
